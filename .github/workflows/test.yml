name: test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: bash -n bin/cmux-remote-notify && python3 -m py_compile remote/hook.py remote/setup.py tools/make-images.py
      - run: bash tests/run.sh
